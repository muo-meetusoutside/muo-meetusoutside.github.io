:root{
  --beige:#F1E7D6;
  --black:#1B1918;
  --orange:#C9782E;
  --orange-deep:#A85F1F;
  --navy:#2B3A56;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--beige);
  color:var(--orange);
  font-family:'Poppins',sans-serif;
  min-height:100vh;
  min-height:100dvh;
  overflow-x:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

.wrap{
  width:100%;
  max-width:720px;
  padding:60px 28px 50px;
  text-align:center;
  position:relative;
}

.mark{
  width:190px;
  height:190px;
  margin:0 auto 6px;
  display:block;
}
.mark img{width:100%;height:100%;display:block;}

.wordmark{
  font-family:'Caveat';
  font-weight:700;
  font-size:56px;
  color:var(--black);
  line-height:1;
  margin-bottom:10px;
}

.sub{
  font-family:'PermanentMarker';
  font-weight:400;
  font-size:21px;
  color:var(--black);
  opacity:.85;
  line-height:1.6;
  max-width:440px;
  margin:34px auto 34px;
}

form{
  display:flex;
  gap:10px;
  max-width:420px;
  margin:0 auto;
  flex-wrap:wrap;
  justify-content:center;
}
input[type="email"]{
  flex:1 1 220px;
  min-width:0;
  padding:16px 20px;
  border-radius:100px;
  border:2px solid var(--black);
  background:transparent;
  color:var(--black);
  font-family:'Poppins';
  font-weight:400;
  font-size:15px;
  outline:none;
}
input[type="email"]::placeholder{color:#6b6459;opacity:.8;}
input[type="email"]:focus{border-color:var(--orange);}

button{
  flex:0 0 auto;
  padding:16px 28px;
  border-radius:100px;
  border:none;
  background:var(--black);
  color:var(--beige);
  font-family:'Poppins';
  font-weight:700;
  font-size:15px;
  cursor:pointer;
  transition:transform .15s ease, background .15s ease;
}
button:hover{background:var(--navy);}
button:active{transform:scale(.96);}

.msg{
  margin-top:18px;
  font-family:'Caveat';
  font-weight:700;
  font-size:24px;
  color:var(--black);
  min-height:30px;
}

@media (max-width:480px){
  form{flex-direction:column;align-items:stretch;}
  input[type="email"]{flex:none;width:100%;}
  button{flex:none;width:100%;}
}
</style>
</head>

<script>
/* ---------- Google Form submission ----------
   Already connected to Eduarda's live MUO email-signup form below.
   If you ever create a NEW Google Form and need to reconnect this:
   1) Create the form with a single "Email" short-answer question.
   2) Click Send → the link icon → copy the shareable link (this is the
      LIVE public link, e.g. .../viewform). Do NOT use the "Preview" (eye
      icon) link — that one is only visible to the form's editor and its
      page source won't contain a usable action URL or entry ID.
   3) Open that live link in an incognito/private window (so you see it
      exactly as a stranger would), right-click → "View Page Source",
      search for "action=" to get the URL ending in /formResponse.
   4) In that same source, search for "entry." near your Email question to
      get its entry ID (looks like entry.123456789).
   5) Paste both values below, then test by submitting your own email on
      the live site and checking it appears in the linked Google Sheet.
------------------------------------------------- */
const GOOGLE_FORM_ACTION_URL = "https://docs.google.com/forms/d/e/1FAIpQLScwt6ifiXGa9fnsubaV6shvEi8McQwf9ttkomV8Ke-pSJiJVQ/formResponse";
const EMAIL_ENTRY_ID = "entry.578904299";

const form = document.getElementById('signupForm');
const msg = document.getElementById('formMsg');

form.addEventListener('submit', function(e){
  e.preventDefault();
  const email = document.getElementById('emailInput').value.trim();
  if(!email) return;

  if(GOOGLE_FORM_ACTION_URL.includes("PASTE_YOUR")){
    msg.textContent = "⚠️ Google Form not connected yet — see the setup guide.";
    return;
  }

  const data = new FormData();
  data.append(EMAIL_ENTRY_ID, email);

  fetch(GOOGLE_FORM_ACTION_URL, {
    method: 'POST',
    mode: 'no-cors',
    body: data
  }).then(function(){
    msg.textContent = "You're on the list 🎉 see you outside.";
    form.reset();
  }).catch(function(){
    msg.textContent = "Hmm, something went wrong — try again?";
  });
});
</script>
